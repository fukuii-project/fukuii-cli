// The formatting engine, resolved dynamically rather than by the plugin's own
// version. The two are released independently and their numbers do not align,
// so this key — not `project/plugins.sbt` — decides how the tree is formatted.
version = "3.11.5"

runner.dialect = scala3

// Chosen against what the tree already is rather than as a house preference:
// measured over the tracked sources, the 99th percentile line is 110 columns
// and eighteen lines exceed 120. A narrower value would rewrap code that was
// deliberately laid out; a wider one would pack lines this project has kept
// apart.
maxColumn = 120

align.preset = some

// ── Scaladoc is prose here, and prose is the deliverable ──
//
// This project's scaladoc carries the reasoning a reader needs — why a bound
// exists, which specification a value came from, what a type refuses. It is
// hand-wrapped so that argument reads in paragraphs.
//
// A formatter that rewraps it destroys that layout invisibly: the text still
// compiles, still says the same words, and no longer reads the way it was
// written. So both keys below are set EXPLICITLY rather than left to a default
// that can change between engine releases — the point is that the engine never
// decides this, whatever it would otherwise do.
docstrings.style = keep
docstrings.wrap = no

// `RedundantParens` is deliberately absent. It strips parentheses from a Scala
// 3 intersection in a `given` declaration — `(A & B)` — where they are what
// separates one intersection type from two type parameters. Left in this list
// as a note to whoever is tempted to complete the set.
rewrite.rules = [AvoidInfix, RedundantBraces, SortModifiers]

rewrite.scala3.convertToNewSyntax = true
rewrite.scala3.removeOptionalBraces = true
