// sbt's own version. This pin can live nowhere else: the launcher reads this
// file before any .sbt file is evaluated, so build.sbt cannot carry it.
//
// 2.0.4 rather than an earlier 2.0.x because 2.0.3 carried three security
// fixes, two of them rated HIGH, and 2.0.4 carries them unchanged:
//
//   CVE-2026-26032   Ivy PackagerResolver path traversal          5.4 MEDIUM
//   CVE-2026-59990   uncontrolled JSON nesting depth (OOM)        7.5 HIGH
//   CVE-2026-61814   quadratic parsing in AsyncParser (CPU)       7.5 HIGH
//
// Worth knowing when auditing this dependency: none of the three is findable by
// a coordinate-keyed advisory scan. sbt vendors a fork of Ivy and bundles Jawn
// transitively, so OSV and NVD report clean for affected sbt versions. The
// successor release's own notes are the instrument that works here.
sbt.version = 2.0.4
